<nav id="spot-nav" class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm transition-all duration-300" style="background-color: var(--nav-bg); border-color: var(--border);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 gap-4">

            <!-- Logo -->
            <a href="/" class="flex items-center gap-2 flex-shrink-0">
                <div class="w-8 h-8 rounded-lg gradient-yellow flex items-center justify-center shadow-sm">
                    <span class="text-black font-bold text-sm">S</span>
                </div>
                <div class="leading-tight">
                    <div class="font-bold text-lg gradient-yellow-text">Spot</div>
                    <div class="text-xs -mt-1" style="color: var(--text-muted);">AI Reservations</div>
                </div>
            </a>

            <!-- Search trigger (desktop) -->
            <button onclick="window.SpotOverlay && window.SpotOverlay.open('homes')"
                    class="flex-1 max-w-sm hidden sm:flex items-center gap-3 border rounded-full px-4 py-2 text-sm shadow-sm hover:shadow-md transition-shadow cursor-pointer"
                    style="border-color: var(--border); background: var(--bg); color: var(--text-muted);">
                <i data-lucide="search" class="w-4 h-4 flex-shrink-0" style="color: var(--text-muted);"></i>
                <span class="flex-1 text-left">Start your search</span>
                <span class="h-5 w-px" style="background: var(--border);"></span>
                <span class="w-7 h-7 gradient-yellow rounded-full flex items-center justify-center flex-shrink-0">
                    <i data-lucide="search" class="w-3 h-3 text-black"></i>
                </span>
            </button>

            <!-- Nav links + auth -->
            <div class="flex items-center gap-3">
                <a href="/homes" class="text-sm font-medium hidden lg:block hover:text-yellow-500 transition-colors" style="color: var(--text-muted);">Homes</a>
                <a href="/experiences" class="text-sm font-medium hidden lg:block hover:text-yellow-500 transition-colors" style="color: var(--text-muted);">Experiences</a>
                <a href="/flights" class="text-sm font-medium hidden lg:block hover:text-yellow-500 transition-colors" style="color: var(--text-muted);">Flights</a>
                <a href="/cars" class="text-sm font-medium hidden lg:block hover:text-yellow-500 transition-colors" style="color: var(--text-muted);">Cars</a>

                <!-- Theme toggle -->
                <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme">
                    <i data-lucide="sun" class="w-4 h-4 dark-hide"></i>
                    <i data-lucide="moon" class="w-4 h-4 light-hide hidden"></i>
                </button>

                {% if session.get('user_id') %}
                    <!-- User dropdown -->
                    <div class="relative">
                        <button
                            onclick="this.nextElementSibling.classList.toggle('hidden')"
                            class="flex items-center gap-2 border rounded-full px-3 py-1.5 hover:shadow-md transition-shadow text-sm"
                            style="border-color: var(--border); background: var(--bg); color: var(--text);">
                            <i data-lucide="menu" class="w-4 h-4" style="color: var(--text-muted);"></i>
                            <i data-lucide="user" class="w-4 h-4" style="color: var(--text-muted);"></i>
                        </button>
                        <div class="hidden absolute right-0 mt-2 w-52 rounded-xl shadow-lg py-1 z-50" style="background: var(--card-bg); border: 1px solid var(--border);">
                            <a href="/profile/" class="flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-gray-50" style="color: var(--text);">
                                <i data-lucide="user" class="w-4 h-4"></i>
                                {{ session.get('name') or session.get('email', 'Profile') }}
                            </a>
                            {% if session.get('role') == 'host' %}
                            <a href="/profile/my-listings" class="flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-gray-50" style="color: var(--text);">
                                <i data-lucide="home" class="w-4 h-4"></i> My Listings
                            </a>
                            {% endif %}
                            <a href="/bookings/my-bookings" class="flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-gray-50" style="color: var(--text);">
                                <i data-lucide="calendar" class="w-4 h-4"></i> My Bookings
                            </a>
                            <a href="/profile/settings" class="flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-gray-50" style="color: var(--text);">
                                <i data-lucide="settings" class="w-4 h-4"></i> Settings
                            </a>
                            <hr style="border-color: var(--border); margin: 4px 0;">
                            <a href="/auth/logout" class="flex items-center gap-2 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50">
                                <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                            </a>
                        </div>
                    </div>
                {% else %}
                    <a href="/auth/login" class="text-sm font-medium hover:underline" style="color: var(--text);">Log in</a>
                    <a href="/auth/register" class="gradient-yellow text-black text-sm font-bold px-4 py-2 rounded-full hover:opacity-90 transition-opacity shadow-sm">
                        Sign up
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
