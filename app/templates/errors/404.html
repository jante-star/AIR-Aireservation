{% extends 'base.html' %}
{% block title %}Page Not Found — Spot{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4" style="background: var(--bg-secondary);">
    <div class="text-center max-w-md">
        <div class="w-20 h-20 rounded-2xl gradient-yellow flex items-center justify-center mx-auto mb-6 shadow-lg">
            <span class="text-black font-bold text-2xl">S</span>
        </div>
        <h1 class="text-7xl font-black gradient-yellow-text mb-4">404</h1>
        <h2 class="text-2xl font-bold mb-3" style="color: var(--text);">Page not found</h2>
        <p class="mb-8" style="color: var(--text-muted);">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="/" class="gradient-yellow text-black font-bold px-8 py-3 rounded-xl hover:opacity-90 transition-opacity inline-block shadow-sm">
            Back to Explore
        </a>
    </div>
</div>
{% endblock %}
